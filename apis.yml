aid: relay-app
name: Relay App
description: >-
  Relay.app is an AI-powered workflow automation platform that converts plain language into reliable visual workflows
  across 200+ app integrations. It supports webhook triggers, custom HTTP requests, scheduled automation,
  human-in-the-loop approval workflows, and MCP server tooling for AI agent integration. Developer features include
  API-triggered workflows, custom JavaScript execution, and integration with OpenAI, Anthropic, and other AI providers.
